esphome:
  name: comfoair-q
  friendly_name: comfoair-q
 
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino
    version: 2.0.14
    platform_version: 6.5.0

# Enable logging
logger:
  level: INFO
  logs:
    canbus: INFO

# Enable Home Assistant API
api:
  encryption:
    key: "mRTlhf5FMNXgPdz1NBugf7//nDhK8etupArmMza5Ydo="

ota:
  - platform: esphome
    password: "9d812e17e14abd12564a9f4877ff33f7"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Vmc Fallback Hotspot"
    password: "mC4RxMSvFQ8X"

captive_portal:

external_components:
  - source: github://yoziru/esphome-zehnder-comfoair


packages:
  base: !include packages/base.yml
  device_base: !include boards/m5stack-atoms3.yml

    
substitutions:
  can_tx_pin: GPIO2
  can_rx_pin: GPIO1
